name: CodeQL Rust

# The Rust analysis takes about four minutes whatever the change, so it only
# runs when the CLI changes. The weekly run picks up new CodeQL queries.
on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - ".github/workflows/codeql-rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/**"
      - ".github/workflows/codeql-rust.yml"
  schedule:
    - cron: "0 0 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:rust
