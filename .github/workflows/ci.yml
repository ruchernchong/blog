name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - parallel:
          - name: Run Lint
            run: pnpm lint

          - name: Run Knip
            run: pnpm knip

          - name: Run Typecheck
            run: pnpm typecheck

          - name: Run Test
            env:
              BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
              DATABASE_URL: ${{ secrets.DATABASE_URL }}
              GH_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
              GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
              GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
              GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
              UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
            run: |
              pnpm --filter @workspace/web exec playwright install --with-deps chromium
              pnpm test

  release:
    name: Release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      HUSKY: 0
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true # semantic-release git commit

      - name: Setup
        uses: ./.github/actions/setup # zizmor: ignore[self-repository]

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so the usage
  # collector is built and attached to the release from here.
  usage-ingest-build:
    name: Usage Ingest Build
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/usage-ingest-build.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.release.outputs.version }}

  usage-ingest-upload:
    name: Usage Ingest Upload
    needs: [ release, usage-ingest-build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: usage-ingest-macos
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh release upload "v$VERSION" \
            dist/usage-ingest-macos.tar.gz \
            dist/usage-ingest-macos.tar.gz.sha256 \
            --repo "$REPO"
