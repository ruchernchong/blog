packages:
  - apps/*
  - packages/*

allowBuilds:
  "@heroui-pro/react": true
  # Pulled in transitively by `workflow`. Both are optional native accelerators
  # with working pure-JS fallbacks, so they are declined for the same reason as
  # esbuild and sharp below.
  "@swc/core": false
  "@zowe/secrets-for-zowe-sdk": false
  cbor-extract: false
  core-js: false
  es5-ext: false
  esbuild: false
  heroui-native-pro: true
  heroui-pro: true
  msw: false
  protobufjs: false
  sharp: false
  # Like esbuild, workerd ships its binary as an optional platform package; the
  # install script only verifies it.
  workerd: false

catalog:
  "@tailwindcss/postcss": ^4.3.0
  "@types/mdx": ^2.0.13
  "@types/node": 24.13.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vercel/config": 0.2.1
  next: 16.4.3
  postcss: ^8.5.23
  react: 19.3.0
  react-dom: 19.3.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  typescript: 7.0.2
  zod: 4.6.6
  vitest: 5.0.0
  "@vitest/browser": 5.0.5
  "@vitest/browser-playwright": 5.0.0
  "@vitest/coverage-v8": 5.0.0

minimumReleaseAgeStrict: true

savePrefix: ""
